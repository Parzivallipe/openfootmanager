name: Build Openfoot Felipe for Windows
on:
  workflow_dispatch:
  push:
    branches: [felipe-edition]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: node --test personal/config.test.mjs
      - run: npm test
      - run: npm run tauri build -- --config src-tauri/tauri.felipe.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: Openfoot-Felipe-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
